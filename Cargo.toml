[package]
name = "open-notch"
version = "0.1.0"
edition = "2021"
authors = ["Gagan Chordia <chordiagagan@gmail.com>"]
description = "A sleek, fluid, and dynamic notch overlay for Linux desktops"
license = "MIT"
readme = "README.md"

[features]
default = []
layer-shell = ["dep:gtk4-layer-shell"]

[dependencies]
# GUI Toolkit
gtk4 = { version = "0.9", features = ["v4_12"] }
gdk4-x11 = "0.9"
gtk4-layer-shell = { version = "0.4", optional = true }
glib = "0.20"

# Async & D-Bus (MPRIS Media Controller)
zbus = { version = "4.4", features = ["tokio"] }
tokio = { version = "1.38", features = ["full"] }

# Serialization & Configuration
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dirs = "5.0"

# Time & Date (Calendar & Pomodoro)
chrono = "0.4"

[package.metadata.deb]
maintainer = "Gagan Chordia <chordiagagan@gmail.com>"
copyright = "2026, Gagan Chordia <chordiagagan@gmail.com>"
license-file = ["LICENSE", "4"]
depends = "$auto, libgtk-4-1 (>= 4.12.0)"
section = "utils"
priority = "optional"
assets = [
    ["target/release/open-notch", "usr/bin/open-notch", "755"],
    ["resources/open-notch.desktop", "usr/share/applications/open-notch.desktop", "644"],
    ["resources/com.github.open_notch.OpenNotch.desktop", "usr/share/applications/com.github.open_notch.OpenNotch.desktop", "644"],
    ["resources/open-notch.desktop", "etc/xdg/autostart/open-notch.desktop", "644"],
    ["resources/icons/hicolor/scalable/apps/*", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["resources/icons/hicolor/symbolic/apps/*", "usr/share/icons/hicolor/symbolic/apps/", "644"],
    ["resources/icons/hicolor/512x512/apps/*", "usr/share/icons/hicolor/512x512/apps/", "644"],
    ["resources/icons/hicolor/256x256/apps/*", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["resources/icons/hicolor/128x128/apps/*", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["resources/icons/hicolor/64x64/apps/*", "usr/share/icons/hicolor/64x64/apps/", "644"],
    ["resources/icons/hicolor/48x48/apps/*", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["resources/icons/hicolor/32x32/apps/*", "usr/share/icons/hicolor/32x32/apps/", "644"],
    ["resources/open-notch.service", "usr/lib/systemd/user/open-notch.service", "644"],
]

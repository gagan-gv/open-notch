<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181a20"/>
      <stop offset="100%" stop-color="#0a0b0e"/>
    </linearGradient>

    <!-- Bezel Subtle Gradient -->
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a2e39"/>
      <stop offset="50%" stop-color="#3d4352"/>
      <stop offset="100%" stop-color="#2a2e39"/>
    </linearGradient>

    <!-- Notch Fill Gradient -->
    <linearGradient id="notchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050507"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Amber Glow -->
    <linearGradient id="amberAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <!-- Cyan Accent -->
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Subtle Drop Shadow Filter -->
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="notchShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#38bdf8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- App Tile Background (Modern Squircle) -->
  <rect x="32" y="32" width="448" height="448" rx="104" ry="104"
        fill="url(#bgGrad)" filter="url(#tileShadow)"
        stroke="rgba(255, 255, 255, 0.12)" stroke-width="2.5"/>

  <!-- Screen Bezel Representation -->
  <rect x="64" y="64" width="384" height="20" rx="10" ry="10" fill="url(#bezelGrad)" opacity="0.3"/>
  <line x1="72" y1="84" x2="440" y2="84" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>

  <!-- Dynamic Ambient Glow Beneath the Notch -->
  <ellipse cx="256" cy="180" rx="140" ry="40" fill="#38bdf8" opacity="0.12" filter="blur(24px)"/>
  <ellipse cx="256" cy="170" rx="90" ry="25" fill="#fb923c" opacity="0.08" filter="blur(16px)"/>

  <!-- The Notch / Dynamic Island Body -->
  <!-- Smooth organic curves descending from top bezel -->
  <g filter="url(#notchShadow)">
    <path d="M 148 84
             C 172 84, 180 94, 186 110
             C 192 126, 196 160, 216 160
             L 296 160
             C 316 160, 320 126, 326 110
             C 332 94, 340 84, 364 84
             Z"
          fill="url(#notchGrad)"
          stroke="rgba(255, 255, 255, 0.14)"
          stroke-width="2"/>
  </g>

  <!-- Expanded Island Silhouette Preview (Soft Glass Arc Below) -->
  <path d="M 120 220
           C 120 200, 140 190, 160 190
           L 352 190
           C 372 190, 392 200, 392 220
           L 392 340
           C 392 364, 372 384, 348 384
           L 164 384
           C 140 384, 120 364, 120 340
           Z"
        fill="rgba(255, 255, 255, 0.03)"
        stroke="rgba(255, 255, 255, 0.08)"
        stroke-width="1.5"/>

  <!-- Shelf Pill Details (Music visualizer, Lens, Timer) -->
  <!-- Center Camera Lens with Emerald Privacy Dot -->
  <circle cx="256" cy="122" r="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="256" cy="122" r="5" fill="#161b22"/>
  <circle cx="258" cy="120" r="1.5" fill="#34d399" opacity="0.9"/>

  <!-- Left Side: Audio Wave / Equalizer Bars -->
  <g transform="translate(208, 114)">
    <rect x="0" y="3" width="3.5" height="10" rx="1.75" fill="url(#cyanAccent)"/>
    <rect x="6" y="0" width="3.5" height="16" rx="1.75" fill="url(#cyanAccent)"/>
    <rect x="12" y="5" width="3.5" height="7" rx="1.75" fill="url(#cyanAccent)"/>
  </g>

  <!-- Right Side: Focus Amber Indicator -->
  <g transform="translate(288, 115)">
    <circle cx="6" cy="7" r="5.5" fill="none" stroke="url(#amberAccent)" stroke-width="2"/>
    <path d="M 6 4 L 6 7 L 8.5 8.5" stroke="url(#amberAccent)" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Shelf Content Representation Inside Expanded Card -->
  <!-- Horizontal divider -->
  <line x1="144" y1="240" x2="368" y2="240" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>

  <!-- Mini Track Bar & Controls Graphic -->
  <rect x="144" y="260" width="56" height="56" rx="12" fill="url(#amberAccent)" opacity="0.85"/>
  <!-- Mini note inside cover -->
  <circle cx="168" cy="292" r="4" fill="#ffffff" opacity="0.9"/>
  <circle cx="178" cy="288" r="4" fill="#ffffff" opacity="0.9"/>
  <path d="M 172 292 L 172 278 L 182 274 L 182 288" stroke="#ffffff" stroke-width="2" fill="none"/>

  <!-- Text Preview Lines -->
  <rect x="214" y="268" width="140" height="8" rx="4" fill="rgba(255, 255, 255, 0.7)"/>
  <rect x="214" y="284" width="90" height="6" rx="3" fill="rgba(255, 255, 255, 0.3)"/>
  <rect x="214" y="304" width="154" height="4" rx="2" fill="rgba(255, 255, 255, 0.1)"/>
  <rect x="214" y="304" width="60" height="4" rx="2" fill="url(#cyanAccent)"/>

  <!-- Minimal Bottom Navigation Dots -->
  <circle cx="236" cy="356" r="3.5" fill="rgba(255, 255, 255, 0.2)"/>
  <circle cx="256" cy="356" r="4" fill="#38bdf8"/>
  <circle cx="276" cy="356" r="3.5" fill="rgba(255, 255, 255, 0.2)"/>
</svg>
